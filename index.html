          <li><a href="https://www.youtube.com/@pass4th383" target="_blank">Pass4th</a></li>
        </ul>

    <!-- Main Title -->
    <h1>Pixel Heart</h1>

    <div><span class="dot"></span></div>

  </div>

  <!-- JavaScript para sa Electric Mouse Effect -->
  <script>
    document.addEventListener('mousemove', function(e) {
      if (Math.random() > 0.35) return;

      const spark = document.createElement('div');
      spark.className = 'electric-spark';

      spark.style.left = e.pageX + 'px';
      spark.style.top = e.pageY + 'px';

      const angle = Math.random() * 360;
      const tx = (Math.random() - 0.5) * 50 + 'px';
      const ty = (Math.random() - 0.5) * 50 + 'px';

      spark.style.setProperty('--angle', angle);
      spark.style.setProperty('--tx', tx);
      spark.style.setProperty('--ty', ty);

      document.body.appendChild(spark);

      setTimeout(() => {
        spark.remove();
      }, 500);
    });
  </script>

</body>
</html>
